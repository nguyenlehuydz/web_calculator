<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calc. — Máy tính hiện đại</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <main class="calculator" role="application" aria-label="Máy tính">

    <header class="calc-header">
      <span class="brand">Calc<span class="brand-dot">.</span></span>
      <div class="header-actions">
        <button class="icon-btn" id="historyToggle" title="Lịch sử" aria-label="Xem lịch sử">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M13 3a9 9 0 1 0 8.94 10H19.9A7 7 0 1 1 13 5v4l5-4.5L13 0v3z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="themeToggle" title="Đổi giao diện" aria-label="Đổi sáng/tối">
          <svg viewBox="0 0 24 24" width="18" height="18" id="themeIcon"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.4 5.4 0 0 1 12 3z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <section class="display" aria-live="polite">
      <div class="memory-tag" id="memoryTag">M</div>
      <div class="expression" id="expression">&nbsp;</div>
      <div class="result-row">
        <div class="result" id="result">0</div>
        <button class="copy-btn" id="copyBtn" title="Sao chép kết quả" aria-label="Sao chép kết quả">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z" fill="currentColor"/></svg>
        </button>
      </div>
    </section>

    <aside class="history-panel" id="historyPanel">
      <div class="history-head">
        <span>Lịch sử tính toán</span>
        <div>
          <button class="text-btn" id="historyClear" style="margin-right: 12px;">Xoá hết</button>
          <button class="text-btn" id="historyClose">Đóng ✕</button>
        </div>
      </div>
      <ul class="history-list" id="historyList">
        <li class="history-empty">Chưa có phép tính nào</li>
      </ul>
    </aside>

    <section class="keypad">
      <button class="key key-mem" data-action="mem-clear">MC</button>
      <button class="key key-mem" data-action="mem-recall">MR</button>
      <button class="key key-mem" data-action="mem-add">M+</button>
      <button class="key key-mem" data-action="mem-sub">M-</button>

      <button class="key key-fn" data-action="clear">AC</button>
      <button class="key key-fn" data-action="delete">DEL</button>
      <button class="key key-fn" data-action="percent">%</button>
      <button class="key key-op" data-op="÷">÷</button>

      <button class="key key-num" data-num="7">7</button>
      <button class="key key-num" data-num="8">8</button>
      <button class="key key-num" data-num="9">9</button>
      <button class="key key-op" data-op="×">×</button>

      <button class="key key-num" data-num="4">4</button>
      <button class="key key-num" data-num="5">5</button>
      <button class="key key-num" data-num="6">6</button>
      <button class="key key-op" data-op="−">−</button>

      <button class="key key-num" data-num="1">1</button>
      <button class="key key-num" data-num="2">2</button>
      <button class="key key-num" data-num="3">3</button>
      <button class="key key-op" data-op="+">+</button>

      <button class="key key-num key-zero" data-num="0">0</button>
      <button class="key key-num" data-num=".">.</button>
      <button class="key key-equals" data-action="equals">=</button>
    </section>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
